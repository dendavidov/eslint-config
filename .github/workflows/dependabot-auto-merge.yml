name: Dependabot auto-merge

on:
  # Dependabot pull requests are treated like forked pull requests, so repository
  # Actions secrets are empty on `pull_request`. This workflow never checks out
  # or executes PR code, making `pull_request_target` safe for the PAT-backed
  # review and auto-merge operations below.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-docker-node-pin:
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'docker')
    steps:
      # This workflow runs with pull_request_target privileges, so check out the
      # Dependabot branch explicitly and only read the Dockerfile. Never execute
      # code from the pull request here.
      - name: Checkout Dependabot branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Synchronize .nvmrc with the Docker image
        run: |
          node_version="$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Dockerfile)"
          if [ -z "$node_version" ]; then
            echo "Could not find a pinned Node version in Dockerfile" >&2
            exit 1
          fi

          printf '%s\n' "$node_version" > .nvmrc
          if git diff --quiet -- .nvmrc; then
            echo ".nvmrc is already synchronized with Node $node_version"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nvmrc
          git commit -m "build: sync Node pin to $node_version"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  enable-auto-merge:
    runs-on: ubuntu-latest
    # Docker PRs are synchronized above but still require a manual merge. This
    # prevents repositories without required status checks from merging before
    # the checks triggered by the synchronization commit have passed.
    if: >-
      github.actor == 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'docker')

    steps:
      - name: Enable auto-merge for Dependabot PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Use a PAT, NOT the default GITHUB_TOKEN: GitHub does not start new
          # workflow runs from pushes made with GITHUB_TOKEN, so an auto-merge
          # enabled with it would never trigger the Release workflow on `main`.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Approve the PR (some branch protection rules require an approval)
          gh pr review --approve "$PR_URL"

          # Enable GitHub's auto-merge; it will merge once all required checks (e.g. `checks` workflow) pass
          gh pr merge --auto --squash "$PR_URL"
